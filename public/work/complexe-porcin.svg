<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Complexe porcin integre - trois paliers et cycle ferme">
  <!--
    Aucune photo du complexe n'existe : il n'est pas encore construit. Plutot
    qu'une image generique de porcherie qui laisserait croire a une
    installation existante, la miniature represente le MODELE — trois paliers
    croissants et le cycle ferme qui les relie.
    Couleur : olive #8AB833, discipline Agriculture & Elevage.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#121215"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#8AB833" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8AB833" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- Trois paliers : 10 / 30 / 50 truies -->
  <g>
    <rect x="90"  y="620" width="170" height="120" fill="#8AB833" fill-opacity="0.22" stroke="#8AB833" stroke-width="2"/>
    <rect x="300" y="470" width="170" height="270" fill="#8AB833" fill-opacity="0.38" stroke="#8AB833" stroke-width="2"/>
    <rect x="510" y="290" width="170" height="450" fill="#8AB833" fill-opacity="0.62" stroke="#8AB833" stroke-width="2.5"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="26" fill="#ECECEE" text-anchor="middle">
    <text x="175" y="600">10</text>
    <text x="385" y="450">30</text>
    <text x="595" y="270">50</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="15" fill="#ECECEE" fill-opacity="0.5" text-anchor="middle" letter-spacing="3">
    <text x="175" y="775">TRUIES</text>
    <text x="385" y="775">TRUIES</text>
    <text x="595" y="775">TRUIES</text>
  </g>

  <!-- Cycle ferme : elevage -> lisier -> compost -> cultures -> aliment -->
  <g fill="none" stroke="#8AB833" stroke-opacity="0.45" stroke-width="2">
    <circle cx="400" cy="180" r="86"/>
    <path d="M400 94 l14 -20 -28 0 z" fill="#8AB833" fill-opacity="0.9" stroke="none"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="13" fill="#ECECEE" fill-opacity="0.62" text-anchor="middle" letter-spacing="1.5">
    <text x="400" y="176">CYCLE</text>
    <text x="400" y="196">FERME</text>
  </g>

  <rect x="0" y="0" width="800" height="3" fill="#8AB833"/>

  <text x="60" y="962" fill="#ECECEE" fill-opacity="0.55"
        font-family="ui-monospace, monospace" font-size="18" letter-spacing="4">
    NAISSEUR - ENGRAISSEUR
  </text>
</svg>
