<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Résine Master — coulée stratifiée et table rivière">
  <!--
    Une coulée de résine vue en coupe : strates successives, veine centrale
    claire — la « table rivière » qui fait la signature du pôle Fine Wood &
    Epoxy. Couleur de la discipline automatisation (#FF8A1F), pour rester
    cohérent avec le classement du projet.
  -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#121215"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.68" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FF8A1F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="slab">
      <rect x="120" y="180" width="560" height="640"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="url(#bg2)"/>
  <rect width="800" height="1000" fill="url(#glow2)"/>

  <!-- le bloc, en coupe -->
  <rect x="120" y="180" width="560" height="640" fill="none"
        stroke="#FF8A1F" stroke-opacity="0.45" stroke-width="2"/>

  <g clip-path="url(#slab)">
    <!-- strates de coulée : chaque passe est une ligne -->
    <g stroke="#FF8A1F" stroke-opacity="0.14" stroke-width="1.5">
      <path d="M120 250 H680"/><path d="M120 300 H680"/><path d="M120 350 H680"/>
      <path d="M120 400 H680"/><path d="M120 450 H680"/><path d="M120 500 H680"/>
      <path d="M120 550 H680"/><path d="M120 600 H680"/><path d="M120 650 H680"/>
      <path d="M120 700 H680"/><path d="M120 750 H680"/>
    </g>

    <!-- la veine centrale : la rivière -->
    <path d="M330 180
             C 300 300, 400 360, 360 470
             C 325 570, 430 640, 395 760
             C 375 800, 380 810, 372 820
             L 470 820
             C 460 780, 500 700, 468 610
             C 440 520, 520 450, 480 340
             C 455 268, 448 220, 452 180 Z"
          fill="url(#river)"/>
  </g>

  <!-- filet de discipline -->
  <rect x="0" y="0" width="800" height="3" fill="#FF8A1F"/>

  <text x="60" y="962" fill="#ECECEE" fill-opacity="0.55"
        font-family="ui-monospace, monospace" font-size="19" letter-spacing="5">
    ÉPOXY — PU — ACRYLIQUE UV
  </text>
</svg>
