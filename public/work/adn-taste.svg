<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="ADN TASTE - six formats de bocaux">
  <!--
    Le packaging n'est pas encore produit : aucune photo n'existe. La miniature
    montre donc ce qui EST decide — la gamme de six contenances, de 7 a 150 g,
    et le bouchon dore qui signe la marque.
    Couleur : safran #F2B705, discipline Agroalimentaire.
  -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#121215"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#F2B705" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F2B705" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg2)"/>
  <rect width="800" height="1000" fill="url(#glow2)"/>

  <!-- Six bocaux, tailles croissantes, alignes sur une meme ligne de sol -->
  <g>
    <!-- x, largeur, hauteur croissantes ; base commune a y=700 -->
    <g>
      <rect x="96"  y="628" width="58"  height="72"  fill="#F2B705" fill-opacity="0.16" stroke="#F2B705" stroke-width="1.6"/>
      <rect x="104" y="618" width="42"  height="12"  fill="#F2B705" fill-opacity="0.9"/>
    </g>
    <g>
      <rect x="180" y="600" width="66"  height="100" fill="#F2B705" fill-opacity="0.22" stroke="#F2B705" stroke-width="1.6"/>
      <rect x="189" y="589" width="48"  height="13"  fill="#F2B705" fill-opacity="0.9"/>
    </g>
    <g>
      <rect x="272" y="566" width="74"  height="134" fill="#F2B705" fill-opacity="0.28" stroke="#F2B705" stroke-width="1.8"/>
      <rect x="282" y="554" width="54"  height="14"  fill="#F2B705" fill-opacity="0.92"/>
    </g>
    <g>
      <rect x="372" y="524" width="84"  height="176" fill="#F2B705" fill-opacity="0.36" stroke="#F2B705" stroke-width="1.8"/>
      <rect x="383" y="511" width="62"  height="15"  fill="#F2B705" fill-opacity="0.94"/>
    </g>
    <g>
      <rect x="482" y="472" width="94"  height="228" fill="#F2B705" fill-opacity="0.46" stroke="#F2B705" stroke-width="2"/>
      <rect x="494" y="458" width="70"  height="16"  fill="#F2B705" fill-opacity="0.96"/>
    </g>
    <g>
      <rect x="602" y="408" width="106" height="292" fill="#F2B705" fill-opacity="0.58" stroke="#F2B705" stroke-width="2.2"/>
      <rect x="615" y="393" width="80"  height="17"  fill="#F2B705"/>
    </g>
  </g>

  <!-- ligne de sol -->
  <rect x="80" y="700" width="640" height="1.5" fill="#ECECEE" fill-opacity="0.22"/>

  <g font-family="ui-monospace, monospace" font-size="14" fill="#ECECEE" fill-opacity="0.55" text-anchor="middle" letter-spacing="1">
    <text x="125" y="728">7g</text>
    <text x="213" y="728">15g</text>
    <text x="309" y="728">30g</text>
    <text x="414" y="728">50g</text>
    <text x="529" y="728">100g</text>
    <text x="655" y="728">150g</text>
  </g>

  <rect x="0" y="0" width="800" height="3" fill="#F2B705"/>

  <text x="60" y="962" fill="#ECECEE" fill-opacity="0.55"
        font-family="ui-monospace, monospace" font-size="18" letter-spacing="4">
    06 FORMATS - 05 FORMES
  </text>
</svg>
