<title>Poste de pilotage — démonstration ADN NETWORK</title>
<!--
  POSTE DE PILOTAGE — DÉMONSTRATION

  Ce fichier illustre la prestation « Le Poste de pilotage » (discipline
  Automatisation). Il n'a aucune dépendance : ni bibliothèque, ni police
  distante, ni requête réseau. Le site interdit tout tiers par sa CSP, et une
  démonstration qui ne s'ouvre pas parce qu'un CDN est lent ne démontre rien.

  Tout est calculé dans le navigateur, tout est conservé en localStorage. Une
  entreprise peut donc l'ouvrir hors connexion, ce qui n'est pas un détail à
  Cotonou.

  L'ENTREPRISE MONTRÉE EST FICTIVE — nom, chiffres, RCCM, IFU, clients et
  factures. Le bandeau le dit en permanence et l'impression le répète, parce
  qu'un document sorti de son écran ne garde que ce qui est imprimé dessus.

  CE QUE LA DÉMONSTRATION CHERCHE À PROUVER : qu'une écriture unique se
  propage. Émettre une facture décrémente le stock, crée les écritures,
  déplace l'encours du client, lève une alerte de réapprovisionnement et
  recalcule le tableau de bord. Le journal d'activité affiche cette cascade
  ligne à ligne — c'est le seul moyen de MONTRER une automatisation plutôt
  que de l'affirmer.
-->
<style>

<div class="demo">

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   1. RÉGLAGES FISCAUX
   Les taux vivent ici et nulle part ailleurs : une loi de finances change, on
   édite une ligne. Recopiés dans les calculs, ils auraient fini par diverger
   entre le devis et la facture — l'erreur la plus coûteuse d'un outil de
   facturation, parce qu'elle ne se voit qu'au contrôle.
   ══════════════════════════════════════════════════════════════════════════ */
const FISC = {
  tva: 0.18,          // Taux normal en vigueur au Bénin
  aibImmatricule: 0.01, // Acompte sur impôt — client disposant d'un IFU
  aibNonImmat: 0.05,    // Client sans IFU : le taux majoré s'applique
};

const MOYENS = ["Espèces", "MTN MoMo", "Moov Money", "Celtiis Cash", "Virement"];

/* ══════════════════════════════════════════════════════════════════════════
   2. LE JEU DE DÉMONSTRATION
   Entreprise inventée. Les identifiants respectent la FORME béninoise
   (RCCM RB/COT/AA B nnnn, IFU à 13 chiffres) sans correspondre à personne :
   un numéro mal formé décrédibiliserait la démonstration, un numéro réel
   désignerait quelqu'un.
   ══════════════════════════════════════════════════════════════════════════ */
function jeuInitial() {
  const A = new Date().getFullYear();
  return {
    societe: {
      nom: "QUINCAILLERIE LE COMPAS",
      forme: "SARL au capital de 5 000 000 FCFA",
      activite: "Quincaillerie & matériaux de construction",
      adresse: "Carré 118, Vodjè — Cotonou, Bénin",
      tel: "+229 01 00 00 00",
      email: "contact@lecompas.example",
      rccm: "RB/COT/" + String(A).slice(2) + " B 4471",
      ifu: "3202600000000",
      banque: "Compte n° 000 000 000 000 — Cotonou",
    },
    exercice: A,
    seq: { devis: 7, facture: 12, reglement: 21 },
    articles: [
      { ref:"CIM-50", nom:"Ciment CPJ 35 — sac 50 kg", unite:"sac", achat:3900, vente:4700, stock:240, seuil:80 },
      { ref:"FER-12", nom:"Fer à béton 12 mm — barre 12 m", unite:"barre", achat:5200, vente:6400, stock:96, seuil:40 },
      { ref:"FER-08", nom:"Fer à béton 8 mm — barre 12 m", unite:"barre", achat:2400, vente:3100, stock:120, seuil:40 },
      { ref:"TOL-BAC", nom:"Tôle bac alu 0,30 — m²", unite:"m²", achat:4100, vente:5300, stock:150, seuil:60 },
      { ref:"PEI-20", nom:"Peinture acrylique — seau 20 L", unite:"seau", achat:14500, vente:18900, stock:22, seuil:12 },
      { ref:"GRA-05", nom:"Gravier 5/15 — tonne", unite:"tonne", achat:11000, vente:14500, stock:60, seuil:25 },
      { ref:"SAB-01", nom:"Sable lagunaire — tonne", unite:"tonne", achat:6500, vente:8800, stock:30, seuil:25 },
      { ref:"TUB-PVC", nom:"Tube PVC 110 — barre 3 m", unite:"barre", achat:3300, vente:4400, stock:74, seuil:60 },
    ],
    clients: [
      { code:"C-001", nom:"Entreprise BATI-SUD", contact:"Service achats", tel:"+229 01 11 11 11", ifu:"3202611111111", adresse:"Godomey" },
      { code:"C-002", nom:"Résidence Les Palmiers", contact:"Conduite de travaux", tel:"+229 01 22 22 22", ifu:"3202622222222", adresse:"Calavi" },
      { code:"C-003", nom:"Atelier NOVA", contact:"Gérance", tel:"+229 01 33 33 33", ifu:"", adresse:"Akpakpa" },
      { code:"C-004", nom:"Coopérative TOGBIN", contact:"Trésorerie", tel:"+229 01 44 44 44", ifu:"3202644444444", adresse:"Togbin" },
    ],
    devis: [], factures: [], reglements: [], mouvements: [], journal: [],
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   3. ÉTAT
   ══════════════════════════════════════════════════════════════════════════ */
const CLE = "adn-pilotage-demo-v1";

/**
 * `S` est déclaré vide ici et rempli TOUT EN BAS du fichier.
 *
 * L'amorçage se sert des fonctions métier — `emettreFacture`, `encaisser` —
 * qui lisent `S` et appellent `fcfa`, `esc`, `encoursClient`. Ces trois-là
 * sont des `const` fléchées : appeler `charger()` à cette ligne les
 * atteindrait dans leur zone morte temporelle et la page ne s'afficherait
 * pas du tout. L'initialisation attend donc que tout le module soit évalué.
 */
let S = null;
let onglet = "bord";

function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) return JSON.parse(brut);
  } catch (e) { /* navigation privée, quota, stockage bloqué : on repart du jeu */ }
  const s = jeuInitial();
  amorcer(s);
  return s;
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) { /* sans effet */ }
}

/* ── Formatage ────────────────────────────────────────────────────────────
   L'espace fine insécable (U+202F) de `toLocaleString("fr")` disparaît dans
   les graisses lourdes : « 175 000 » s'y lit « 175000 ». On repasse à
   l'insécable ordinaire, qui résiste au resserrement. */
const fcfa = (n) => Math.round(n).toLocaleString("fr").replace(/ /g, " ") + " F";
const jourFr = (iso) => new Date(iso).toLocaleDateString("fr", { day:"2-digit", month:"2-digit", year:"numeric" });
const heureFr = (iso) => new Date(iso).toLocaleTimeString("fr", { hour:"2-digit", minute:"2-digit" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ══════════════════════════════════════════════════════════════════════════
   4. LE MOTEUR — la cascade
   Un seul geste métier déclenche tout le reste. C'est ce que la prestation
   vend, donc c'est ce que la démonstration doit rendre VISIBLE : chaque
   conséquence est tracée dans le journal, marquée « auto ».
   ══════════════════════════════════════════════════════════════════════════ */
/**
 * Le journal se lit du plus récent au plus ancien. Écrites une à une, les
 * conséquences d'un geste se retrouvaient donc AU-DESSUS de lui : on lisait
 * « encours porté à… » avant « facture émise ». Une cascade affichée à
 * l'envers ne démontre rien du tout.
 *
 * `geste()` regroupe donc l'action et ses suites en un bloc, inséré d'un seul
 * coup : l'action garde la tête de son propre bloc, et les blocs restent
 * ordonnés du plus récent au plus ancien.
 */
let bloc = null;

function tracer(texte, auto) {
  const e = { t: new Date().toISOString(), texte, auto: !!auto };
  if (bloc) bloc.push(e);
  else S.journal.unshift(e);
}

function geste(fn) {
  const parent = bloc;      // les amorçages imbriqués ne cassent pas le bloc
  if (!parent) bloc = [];
  const r = fn();
  if (!parent) {
    S.journal.unshift(...bloc);
    bloc = null;
    if (S.journal.length > 220) S.journal.length = 220;
  }
  return r;
}

/** Totaux d'un document. Le taux d'AIB dépend de l'IFU du client, pas d'un choix. */
function totaux(lignes, client) {
  const ht = lignes.reduce((s, l) => s + l.pu * l.qte, 0);
  const tva = ht * FISC.tva;
  const taux = client && client.ifu ? FISC.aibImmatricule : FISC.aibNonImmat;
  const aib = ht * taux;
  return { ht, tva, aib, tauxAib: taux, ttc: ht + tva + aib };
}

function cout(lignes) {
  return lignes.reduce((s, l) => {
    const a = S.articles.find((x) => x.ref === l.ref);
    return s + (a ? a.achat * l.qte : 0);
  }, 0);
}

/** Le geste central : émettre une facture. Tout le reste en découle. */
function emettreFacture(clientCode, lignes, origineDevis) { return geste(() => {
  const client = S.clients.find((c) => c.code === clientCode);
  const num = "F-" + S.exercice + "-" + String(++S.seq.facture).padStart(4, "0");
  const t = totaux(lignes, client);
  const f = {
    num, date: new Date().toISOString(), client: clientCode,
    lignes: lignes.map((l) => ({ ...l })),
    ht: t.ht, tva: t.tva, aib: t.aib, tauxAib: t.tauxAib, ttc: t.ttc,
    cout: cout(lignes), regle: 0, etat: "impaye", devis: origineDevis || null,
  };
  S.factures.unshift(f);
  tracer("Facture <b>" + num + "</b> émise — " + fcfa(t.ttc) + " TTC");

  // ── Conséquence 1 : le stock bouge, et les alertes se lèvent seules.
  let alertes = 0;
  lignes.forEach((l) => {
    const a = S.articles.find((x) => x.ref === l.ref);
    if (!a) return;
    a.stock -= l.qte;
    S.mouvements.unshift({
      t: new Date().toISOString(), ref: a.ref, sens: "sortie",
      qte: l.qte, motif: num, reste: a.stock,
    });
    if (a.stock <= a.seuil) alertes++;
  });
  tracer("Stock décrémenté sur " + lignes.length + " référence" + (lignes.length > 1 ? "s" : ""), true);
  if (alertes) tracer(alertes + " référence" + (alertes > 1 ? "s passent" : " passe") + " sous le seuil de réapprovisionnement", true);

  // ── Conséquence 2 : les écritures, y compris la TVA collectée et l'AIB.
  tracer("Écritures passées — vente, TVA collectée " + fcfa(t.tva) + ", AIB " + fcfa(t.aib), true);

  // ── Conséquence 3 : l'encours du client, donc le tableau de bord.
  tracer("Encours de " + esc(client ? client.nom : "?") + " porté à " + fcfa(encoursClient(clientCode) ), true);

  // ── Conséquence 4 : le devis d'origine change d'état tout seul.
  if (origineDevis) {
    const d = S.devis.find((x) => x.num === origineDevis);
    if (d) { d.etat = "facture"; d.facture = num; tracer("Devis " + origineDevis + " marqué facturé", true); }
  }
  sauver();
  return f;
}); }

function encaisser(numFacture, montant, moyen) { geste(() => {
  const f = S.factures.find((x) => x.num === numFacture);
  if (!f) return;
  const num = "R-" + S.exercice + "-" + String(++S.seq.reglement).padStart(4, "0");
  const m = Math.min(montant, f.ttc - f.regle);
  S.reglements.unshift({ num, t:new Date().toISOString(), facture:numFacture, montant:m, moyen });
  f.regle += m;
  f.etat = f.regle >= f.ttc - 1 ? "paye" : "partiel";
  tracer("Règlement <b>" + num + "</b> — " + fcfa(m) + " par " + moyen);
  tracer("Facture " + numFacture + " : " + (f.etat === "paye" ? "soldée" : "reste " + fcfa(f.ttc - f.regle)), true);
  tracer("Journal de caisse et trésorerie mis à jour", true);
  sauver();
}); }

function entrerStock(ref, qte, motif) { geste(() => {
  const a = S.articles.find((x) => x.ref === ref);
  if (!a) return;
  const sousSeuilAvant = a.stock <= a.seuil;
  a.stock += qte;
  S.mouvements.unshift({ t:new Date().toISOString(), ref, sens:"entrée", qte, motif, reste:a.stock });
  tracer("Entrée de " + qte + " " + a.unite + " — " + a.ref + " (" + motif + ")");
  if (sousSeuilAvant && a.stock > a.seuil) tracer("Alerte levée sur " + a.ref, true);
  sauver();
}); }

/* ── Agrégats, tous recalculés à la lecture ────────────────────────────────
   Rien n'est stocké en cache : un total mémorisé à côté de ses lignes finit
   toujours par ne plus leur correspondre. */
const encoursClient = (code) => S.factures.filter((f) => f.client === code && f.etat !== "paye")
  .reduce((s, f) => s + (f.ttc - f.regle), 0);
const creances = () => S.factures.filter((f) => f.etat !== "paye").reduce((s, f) => s + (f.ttc - f.regle), 0);
const encaisse = () => S.reglements.reduce((s, r) => s + r.montant, 0);
const caHT = () => S.factures.reduce((s, f) => s + f.ht, 0);
const margeBrute = () => S.factures.reduce((s, f) => s + (f.ht - f.cout), 0);
const tvaCollectee = () => S.factures.reduce((s, f) => s + f.tva, 0);
const stockValorise = () => S.articles.reduce((s, a) => s + a.stock * a.achat, 0);
const sousSeuil = () => S.articles.filter((a) => a.stock <= a.seuil);

/* ══════════════════════════════════════════════════════════════════════════
   5. AMORÇAGE — un historique crédible dès la première ouverture
   Un tableau de bord vide ne démontre rien : il faut des créances, une marge,
   une alerte de stock et un devis en attente pour que chaque écran ait
   quelque chose à montrer.
   ══════════════════════════════════════════════════════════════════════════ */
function amorcer(s) {
  // Les fonctions métier écrivent dans `S` : on l'y installe avant de les
  // appeler. `charger()` renvoie ensuite ce même objet, que l'appelant
  // réassigne à `S` — il n'y a donc rien à restaurer.
  S = s;
  const L = (ref, qte) => { const a = S.articles.find((x) => x.ref === ref); return { ref, nom:a.nom, unite:a.unite, pu:a.vente, qte }; };

  emettreFacture("C-001", [L("CIM-50", 60), L("FER-12", 24)]);
  encaisser(S.factures[0].num, S.factures[0].ttc, "Virement");

  emettreFacture("C-002", [L("TOL-BAC", 40), L("PEI-20", 6)]);
  encaisser(S.factures[0].num, 250000, "MTN MoMo");

  emettreFacture("C-003", [L("SAB-01", 12), L("GRA-05", 8)]);
  emettreFacture("C-004", [L("FER-08", 30), L("TUB-PVC", 18)]);

  S.devis.unshift({
    num: "D-" + S.exercice + "-" + String(++S.seq.devis).padStart(4, "0"),
    date: new Date().toISOString(), client: "C-002", etat: "envoye",
    lignes: [L("CIM-50", 120), L("FER-12", 40), L("GRA-05", 15)],
  });
  tracer("Devis " + S.devis[0].num + " envoyé à Résidence Les Palmiers");

  entrerStock("PEI-20", 18, "Réception fournisseur");
  sauver();
}

function champLignes() {
  return '<div class="lignes" id="lignes"></div>' +
    '<button type="button" class="btn sec mini" id="btnAddLigne">+ Ajouter une ligne</button>' +
    '<p class="lab" style="margin-top:14px" id="apercu"></p>';
}

function monterLignes(clientSel) {
  const cont = document.getElementById("lignes");
  const ajouter = () => {
    const i = cont.children.length;
    const d = document.createElement("div");
    d.className = "ligne";
    d.innerHTML =
      '<select data-r="' + i + '">' + S.articles.map((a) =>
        '<option value="' + a.ref + '">' + esc(a.nom) + "</option>").join("") + "</select>" +
      '<input type="number" min="1" value="1" data-q="' + i + '">' +
      '<input type="text" readonly data-p="' + i + '">' +
      '<button type="button" class="btn sec mini" data-sup="' + i + '">×</button>';
    cont.appendChild(d);
    majApercu();
  };
  cont.addEventListener("input", majApercu);
  cont.addEventListener("click", (e) => {
    if (e.target.dataset.sup !== undefined) { e.target.closest(".ligne").remove(); majApercu(); }
  });
  document.getElementById("btnAddLigne").addEventListener("click", ajouter);
  if (clientSel) clientSel.addEventListener("change", majApercu);
  ajouter();
}

function lireLignes() {
  return [...document.querySelectorAll("#lignes .ligne")].map((d) => {
    const ref = d.querySelector("select").value;
    const qte = Math.max(1, parseInt(d.querySelector('input[type="number"]').value, 10) || 1);
    const a = S.articles.find((x) => x.ref === ref);
    return { ref, nom:a.nom, unite:a.unite, pu:a.vente, qte };
  });
}

function majApercu() {
  const l = lireLignes();
  document.querySelectorAll("#lignes .ligne").forEach((d, i) => {
    d.querySelector('input[readonly]').value = fcfa(l[i].pu * l[i].qte);
  });
  const sel = document.getElementById("clientSel");
  const c = sel ? S.clients.find((x) => x.code === sel.value) : null;
  const t = totaux(l, c);
  const ap = document.getElementById("apercu");
  if (ap) ap.innerHTML = "HT " + fcfa(t.ht) + " · TVA " + fcfa(t.tva) +
    " · AIB " + (t.tauxAib * 100) + " % " + fcfa(t.aib) +
    ' · <span style="color:var(--signal)">TTC ' + fcfa(t.ttc) + "</span>";
}

function selClients() {
  return '<select id="clientSel">' + S.clients.map((c) =>
    '<option value="' + c.code + '">' + esc(c.nom) + (c.ifu ? "" : " — sans IFU") + "</option>").join("") + "</select>";
}

function dialogueDocument(estFacture) {
  ouvrir(estFacture ? "Nouvelle facture" : "Nouveau devis",
    '<div class="champ"><label class="lab">Client</label>' + selClients() + "</div>" +
    '<div class="champ"><label class="lab">Lignes</label>' + champLignes() + "</div>",
    '<button class="btn sec" value="annuler">Annuler</button>' +
    '<button class="btn" value="ok" id="btnValider">' + (estFacture ? "Émettre" : "Enregistrer") + "</button>");
  monterLignes(document.getElementById("clientSel"));
  document.getElementById("btnValider").addEventListener("click", () => {
    const code = document.getElementById("clientSel").value;
    const lignes = lireLignes();
    if (!lignes.length) return;
    if (estFacture) emettreFacture(code, lignes);
    else {
      S.devis.unshift({ num:"D-" + S.exercice + "-" + String(++S.seq.devis).padStart(4, "0"),
        date:new Date().toISOString(), client:code, etat:"envoye", lignes });
      tracer("Devis <b>" + S.devis[0].num + "</b> créé");
      sauver();
    }
    setTimeout(rendre, 0);
  });
}

      </tr>
      ${f.lignes.map((l) => '<tr><td style="border-bottom:1px solid #ddd; padding:7px 8px">' + esc(l.nom) +
        '</td><td class="num" style="border-bottom:1px solid #ddd; padding:7px 8px">' + l.qte + " " + esc(l.unite) +
        '</td><td class="num" style="border-bottom:1px solid #ddd; padding:7px 8px">' + fcfa(l.pu) +
        '</td><td class="num" style="border-bottom:1px solid #ddd; padding:7px 8px">' + fcfa(l.pu * l.qte) + "</td></tr>").join("")}
    </table>
    <div style="display:flex; justify-content:flex-end; margin-top:16px">
      <table class="mono" style="width:290px; font-size:12px">
        <tr><td style="border:0; padding:4px 8px">Total HT</td><td class="num" style="border:0; padding:4px 8px">${fcfa(f.ht)}</td></tr>
        <tr><td style="border:0; padding:4px 8px">TVA ${FISC.tva * 100} %</td><td class="num" style="border:0; padding:4px 8px">${fcfa(f.tva)}</td></tr>
        <tr><td style="border:0; padding:4px 8px">AIB ${f.tauxAib * 100} %</td><td class="num" style="border:0; padding:4px 8px">${fcfa(f.aib)}</td></tr>
        <tr style="border-top:2px solid #000"><td style="border:0; padding:7px 8px; font-weight:700">Net à payer</td>
          <td class="num" style="border:0; padding:7px 8px; font-weight:700">${fcfa(f.ttc)}</td></tr>
      </table>
    </div>
    <div class="mono" style="margin-top:28px; font-size:10px; line-height:1.8; border-top:1px solid #ccc; padding-top:12px">
      Règlement par ${MOYENS.join(", ")}. ${esc(so.banque)}.<br>
      Facture émise par le Poste de pilotage — outil produit par ADN NETWORK, Cotonou.
    </div>`;
  window.print();
}

/* ══════════════════════════════════════════════════════════════════════════
   9. EXPORT
   Point-virgule et BOM : le tableur d'un poste francophone ouvre le fichier
   directement, sans passer par un assistant d'importation que personne ne
   sait régler.
   ══════════════════════════════════════════════════════════════════════════ */
function exportCsv() {
  const l = [["Date", "Heure", "Origine", "Événement"]].concat(
    S.journal.map((e) => [jourFr(e.t), heureFr(e.t), e.auto ? "automatique" : "saisie",
      e.texte.replace(/<[^>]+>/g, "")]));
  const csv = "﻿" + l.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = "journal-demonstration.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ══════════════════════════════════════════════════════════════════════════
   10. ÉVÉNEMENTS — délégation unique
   ══════════════════════════════════════════════════════════════════════════ */
document.getElementById("nav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-onglet]");
  if (b) { onglet = b.dataset.onglet; rendre(); }
});

document.getElementById("vue").addEventListener("click", (e) => {
  const t = e.target;
  if (t.id === "btnNouveauDevis") return dialogueDocument(false);
  if (t.id === "btnNouvelleFacture") return dialogueDocument(true);
  if (t.id === "btnEntree") return dialogueEntree();
  if (t.id === "btnCsv") return exportCsv();
  if (t.dataset.encaisser) return dialogueEncaissement(t.dataset.encaisser);
  if (t.dataset.imprimer) return imprimer(t.dataset.imprimer);
  if (t.dataset.facturer) {
    const d = S.devis.find((x) => x.num === t.dataset.facturer);
    if (d) { emettreFacture(d.client, d.lignes, d.num); onglet = "factures"; rendre(); }
  }
});

document.getElementById("btnReset").addEventListener("click", () => {
  try { localStorage.removeItem(CLE); } catch (e) {}
  S = charger();
  onglet = "bord";
  rendre();
});

S = charger();
rendre();
</script>
