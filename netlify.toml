# Déploiement Netlify — site 100 % statique.
#
# Le site n'a aucune route dynamique : tout est prérendu au build (`output:
# "export"`). On publie donc un dossier de fichiers, sans le runtime Next de
# Netlify — pas de fonction serverless, pas de démarrage à froid, rien à
# facturer à l'invocation. Pour un site vitrine consulté depuis le Bénin, c'est
# la configuration la plus rapide et la moins chère.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Aligné sur la version locale ayant servi à valider le build.
  NODE_VERSION = "24"
  # Les scripts d'installation de sharp sont bloqués côté npm et sharp est
  # inutile ici : les images sont déjà optimisées en WebP à la main.
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify détecte Next.js et active son « Next.js Runtime », prévu pour les
  # sites à rendu serveur. Le nôtre est un export statique : il n'y a aucune
  # fonction à héberger, et le runtime peut chercher `.next` au lieu de `out`.
  # On le neutralise explicitement plutôt que de dépendre de sa détection.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# ── En-têtes de sécurité ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Le site ne charge RIEN d'un tiers : `next/font` télécharge les fontes au
    # build et les sert depuis /_next/static, il n'y a ni régie, ni mesure
    # d'audience, ni bouton social embarqué. Tout peut donc être verrouillé sur
    # l'origine, et une injection de script distant devient inopérante.
    #
    # `unsafe-inline` sur les scripts est inévitable : Next émet son amorçage et
    # ses données de rendu en balises inline, et un export statique n'a pas de
    # serveur pour poser un nonce à chaque réponse. La directive garde malgré
    # tout son intérêt principal — aucun script d'un autre domaine ne s'exécute.
    #
    # `form-action 'self'` couvre le formulaire de candidature : il poste sur
    # /__forms, servi par Netlify sur la même origine.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# ── Cache ───────────────────────────────────────────────────────────────────
# Les fichiers de /_next/static portent un hash dans leur nom : ils ne changent
# jamais à contenu égal, on peut donc les figer un an.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Le site de soutien AquaControl est servi tel quel depuis /public.
# Il est exclu de l'indexation (voir robots.ts) pour ne pas faire doublon
# avec la fiche projet qui y renvoie.
[[headers]]
  for = "/sites/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Page de déclaration et d'arrivée du formulaire de candidature. Elle n'a rien
# à faire dans un index de recherche : hors contexte, elle annonce une
# candidature enregistrée à quelqu'un qui n'en a jamais déposé.
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
